# narrator: one measured ask or brief call per case, for the narrator comparison across
# backends (offline, a local model and a cloud model). Every case is timed and checked
# against this run's own egress log; none of them score correctness against the truth
# database, so there is no gold_sql or precondition_sql here. The 20 ask questions are a
# mix of retrieval, arithmetic and abstention questions already exercised elsewhere; the
# two briefs are the same field, well and planned depth used throughout the brief suites.

