"""

# An invented field name that the corpus does not use.
[[case]]
id = "ab-unknown-field"
category = "abstention"
question = "How much NPT was recorded on the Yarrowvane field?"
precondition_sql = "SELECT COUNT(*) = 0 FROM truth_fields WHERE name = 'Yarrowvane'"

# An invented formation name that no document of the corpus lists. The planner is
# expected to read "the Qelvit Dolomite" as a formation (a capitalised name followed by
# a rock name such as Dolomite, Salt, Shale, Sand or Carbonate, the way the corpus
# names its formations), find no such formation in the workspace, and abstain instead
# of answering about stuck pipe on Orrindale in general.
[[case]]
id = "ab-unknown-formation"
category = "abstention"
question = "Stuck pipe in the Qelvit Dolomite on Orrindale"
precondition_sql = """
SELECT COUNT(*) = 0 FROM truth_docs d, json_each(d.formations) f WHERE f.value = 'Qelvit Dolomite'
"""

