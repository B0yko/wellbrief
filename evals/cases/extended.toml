# ---------------------------------------------------------------------------
# Arithmetic
# ---------------------------------------------------------------------------

[[case]]
id = "ar-orrindale-instability-hours"
category = "arithmetic"
question = "How many hours of wellbore instability on Orrindale?"
figure = "total_hours"
gold_sql = "SELECT ROUND(SUM(hours), 1) FROM truth_events WHERE field = 'Orrindale' AND code = 'WELLBORE_INSTABILITY'"

[[case]]
id = "ar-orrindale-fishing-hours"
category = "arithmetic"
question = "How many hours of fishing on Orrindale?"
figure = "total_hours"
gold_sql = "SELECT ROUND(SUM(hours), 1) FROM truth_events WHERE field = 'Orrindale' AND code = 'FISHING'"

[[case]]
id = "ar-vessra-tool-failure-hours"
category = "arithmetic"
question = "How many hours of downhole tool failure on Vessra South?"
figure = "total_hours"
gold_sql = "SELECT ROUND(SUM(hours), 1) FROM truth_events WHERE field = 'Vessra South' AND code = 'DOWNHOLE_TOOL_FAILURE'"

# Every rig repair of the field: mud pump and drawworks.
[[case]]
id = "ar-vessra-rig-repair-hours"
category = "arithmetic"
question = "How many hours of rig repair on Vessra South?"
figure = "total_hours"
gold_sql = "SELECT ROUND(SUM(hours), 1) FROM truth_events WHERE field = 'Vessra South' AND code = 'RIG_REPAIR'"

# One well, every code.
[[case]]
id = "ar-well-total-ord-112"
category = "arithmetic"
question = "What was the total non-productive time on ORD-112?"
figure = "total_hours"
gold_sql = "SELECT ROUND(SUM(hours), 1) FROM truth_events WHERE well = 'ORD-112'"

# One hole section of one field, every code.
[[case]]
id = "ar-section-total-orrindale-12-1-4"
category = "arithmetic"
question = "Total NPT hours in the 12 1/4\" section on Orrindale?"
figure = "total_hours"
gold_sql = "SELECT ROUND(SUM(hours), 1) FROM truth_events WHERE field = 'Orrindale' AND section = '12 1/4\"'"

# One formation of one field, every code.
[[case]]
id = "ar-formation-total-keldra-salt-orrindale"
category = "arithmetic"
question = "How many NPT hours were recorded in Keldra Salt on Orrindale?"
figure = "total_hours"
gold_sql = "SELECT ROUND(SUM(hours), 1) FROM truth_events WHERE field = 'Orrindale' AND formation = 'Keldra Salt'"

# Avoidable share: every code except the three the taxonomy marks unavoidable
# (weather, third-party standby, HSE stop).
[[case]]
id = "ar-avoidable-share-vessra-south"
category = "arithmetic"
question = "What share of the NPT on Vessra South was avoidable?"
figure = "avoidable_share"
gold_sql = """
SELECT SUM(CASE WHEN code NOT IN ('WAIT_ON_WEATHER', 'THIRD_PARTY_STANDBY', 'HSE_STOP') THEN hours ELSE 0 END) / SUM(hours)
FROM truth_events WHERE field = 'Vessra South'
"""

# Cost = hours / 24 x spread rate, at a rate the question states and the case passes.
[[case]]
id = "ar-cost-stuck-pipe-orrindale-60k"
category = "arithmetic"
question = "What did stuck pipe cost on Orrindale at a spread rate of $60,000 per day?"
figure = "total_cost_usd"
spread_rate = 60000
gold_sql = "SELECT SUM(hours) / 24.0 * :spread_rate FROM truth_events WHERE field = 'Orrindale' AND code = 'STUCK_PIPE'"

