# ---------------------------------------------------------------------------
# Retrieval precision: planner variants
# ---------------------------------------------------------------------------

# The unit-spelling variants ask about codes that occur in every hole section, so only
# a planner that reads the spelling can separate the relevant reports from the rest.
# These codes have no lessons or incident reports, and the EOWR NPT table is not broken
# down by section, so the relevant documents are the daily reports alone.

# Unit spelling "17-1/2 in". Waiting on materials happens in every section.
[[case]]
id = "rp-section-dash-in"
category = "retrieval-precision"
question = "Waiting on materials in the 17-1/2 in section on Orrindale"
field = "Orrindale"
relevant_sql = """
SELECT DISTINCT doc_id FROM truth_events
 WHERE field = 'Orrindale' AND code = 'WAIT_ON_MATERIALS' AND section = '17 1/2"'
"""

# Decimal unit spelling 12.25". Rig repairs (drawworks) happen in every section.
[[case]]
id = "rp-section-decimal"
category = "retrieval-precision"
question = "Rig repairs in the 12.25\" hole on Orrindale"
field = "Orrindale"
relevant_sql = """
SELECT DISTINCT doc_id FROM truth_events WHERE field = 'Orrindale' AND code = 'RIG_REPAIR' AND section = '12 1/4"'
"""

# Unicode fraction 12¼" on the other field. HSE stops happen in every section.
[[case]]
id = "rp-section-unicode"
category = "retrieval-precision"
question = "HSE stops in 12¼\" hole on Vessra South"
field = "Vessra South"
relevant_sql = """
SELECT DISTINCT doc_id FROM truth_events WHERE field = 'Vessra South' AND code = 'HSE_STOP' AND section = '12 1/4"'
"""

# Unit spelling "12 1/4 in". Hole cleaning happens in every section, so only the section
# filter separates the relevant reports from the rest.
[[case]]
id = "rp-section-space-in"
category = "retrieval-precision"
question = "Hole cleaning problems in the 12 1/4 in section on Orrindale"
field = "Orrindale"
relevant_sql = """
SELECT DISTINCT doc_id FROM truth_events WHERE field = 'Orrindale' AND code = 'HOLE_CLEANING' AND section = '12 1/4"'
"""

# Lower-case well id. Relevant: the well's daily reports with NPT entries, its incident
# reports and its EOWR (its NPT table answers the question).
[[case]]
id = "rp-well-lowercase"
category = "retrieval-precision"
question = "What non-productive time was booked on ord-108?"
field = "Orrindale"
relevant_sql = """
SELECT doc_id FROM truth_events WHERE well = 'ORD-108'
UNION SELECT doc_id FROM truth_docs WHERE well = 'ORD-108' AND type IN ('eowr', 'incident')
"""

# "around 2,650 m" read as within 100 m: loss reports with the entry depth in
# 2,550-2,750 m, loss incident reports at that depth, and the EOWR lessons that record
# the total losses (at the carbonate top, 2,660 m).
[[case]]
id = "rp-depth-around"
category = "retrieval-precision"
question = "Losses around 2,650 m on Vessra South"
field = "Vessra South"
relevant_sql = """
SELECT doc_id FROM truth_events
 WHERE field = 'Vessra South' AND code = 'LOST_CIRCULATION' AND depth_m BETWEEN 2550 AND 2750
UNION SELECT doc_id FROM truth_docs
 WHERE type = 'incident' AND field = 'Vessra South' AND code = 'LOST_CIRCULATION' AND depth_m BETWEEN 2550 AND 2750
UNION SELECT doc_id FROM truth_sentences WHERE field = 'Vessra South' AND code = 'LOST_CIRCULATION' AND label = 'failure'
"""

# A depth-led question with no code: the reports with an NPT entry within 100 m of
# 1,850 m, whatever the code (the intermediate casing point of Orrindale, where casing,
# cementing and BOP test entries cluster). Only the depth separates them from the
# field's other reports.
[[case]]
id = "rp-depth-led"
category = "retrieval-precision"
question = "What NPT was booked around 1,850 m on Orrindale?"
field = "Orrindale"
relevant_sql = """
SELECT DISTINCT doc_id FROM truth_events WHERE field = 'Orrindale' AND depth_m BETWEEN 1750 AND 1950
"""

# Paraphrase "pack-off" for stuck pipe: the stuck pipe reports in every section, the
# incident reports, the EOWR failure lessons and the EOWRs whose NPT table lists stuck
