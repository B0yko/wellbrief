# Extended suite: what the specification expects of v0.1, written before the
# fixes it measures. Cases are never removed or loosened after the first run;
# every change is listed in evals/CHANGES.md with its reason.
#
# Gold answers and relevance labels are SQL over the truth database built from
# the generator's `_truth.json` (never over the product's own database):
#   truth_events     one row per NPT DETAIL entry of a daily report (DDR): doc_id,
#                    well, field, date, code, hours, depth_m, section, formation, rig,
#                    mwd, pattern (G1-G4 or NULL), variant, occurrence, part, parts.
#                    An event that runs over several reports has one row per report.
#   truth_docs       one row per document: doc_id, type (ddr | eowr | incident),
#                    field, well, date, sections and formations (JSON lists); incident
#                    reports also carry code, hours, depth_m, section, formation and
#                    event_id (the first DDR entry of the event).
#   truth_sentences  EOWR lessons and recommendations and incident corrective
#                    actions: doc_id, kind, text, label (practice | failure | neutral),
#                    patterns (JSON list), code.
#   truth_wells      per well: rig, mwd, g1..g4 (affected | clean | out_of_scope).
#   truth_patterns   one row per planted-pattern key: id, field, scope, driver, code,
#                    section, formation, rig, mwd.
#   truth_fields     one row per field: name, prefix, operator, rigs, mwd_tools, patterns.
#
# Pass rules per category (thresholds live in the harness, not in the cases):
#   retrieval-precision  over the retrieval ranking of `question` (one entry per
#                        document, best chunk): P@8 = |top 8 ∩ relevant| /
#                        min(8, |relevant|) >= 0.5, and no document from another field
#                        among the top 8 and the citations. MRR@8 is reported. The cut
#                        is always 8. The reported means cover every case; a case that
#                        cannot be scored counts as 0.
#   arithmetic           the answer's `figure` within 0.05 h (total_hours), $1
#                        (total_cost_usd) or 0.001 (avoidable_share) of `gold_sql`;
#                        `spread_rate` is passed to the product and bound as :spread_rate.
#   abstention           `precondition_sql` must confirm the empty scope on the truth
#                        (else the case fails as broken); the answer carries no figures,
#                        no citations, and the line
#                        "No records in this workspace match that question."
#                        When the product reports whether it abstained, it must say yes.
#   brief-recall         the brief (field, well, td_m; no rig, no MWD) lists a risk that
#                        matches a key of `pattern` in truth_patterns.
#   brief-driver         the highest-ranked risk matching `pattern` names the driver the
#                        truth gives for it (mud_weight | tool | rig), and a tool or rig
#                        driver blames the tool or rig of the pattern's key (PJ-3 for G3,
#                        Vessra-3 for G4).
#   mitigation-precision every mitigation quoted anywhere in the brief is contained in a
#                        truth sentence of its source document that is labelled practice
#                        and that the truth relates to the risk (the risk's code, or a
#                        planted pattern the risk matches); the source is either the EOWR
#                        of a well that avoided the risk or an incident report with the
#                        risk's code. "Avoided" is the miner's definition, computed from
#                        the true events: for an interval risk, a well with a daily report
#                        in the risk's section and formation and no event of its code there;
#                        for an equipment risk, a well of the field on another rig (or MWD
#                        tool) that did not have the event. For an equipment risk that
#                        matches a planted pattern, "the event" is an event of that pattern:
#                        same-code events on the other rig that belong to no pattern (the
#                        drawworks repairs on Vessra-5 next to the G4 mud pump pattern) do
#                        not disqualify a well. For any other equipment risk it is any event
#                        of the risk's code. A brief that quotes no mitigation fails.
#   mitigation-recall    the risks matching `pattern` quote at least one truth sentence
#                        labelled practice that relates to `pattern`.
#   parser-fidelity      the parsed ledger of `field` against `gold_sql` rows, matched on
#                        doc_id + code + hours: precision = recall = 1.0 and total hours
#                        within 0.05 h. Depth, section and formation agreement is reported.
#   format-parity        the pdf / docx / csv rendering of the same corpus, ingested into a
#                        workspace of its own, gives the same ledger rows as the txt
#                        rendering, field by field over the whole workspace (rows filed
#                        under no field or a wrong field count against it); every question
#                        in `questions` is answered with at least one citation, and every
#                        quote is verbatim in the txt rendering of the cited document (for
#                        the csv rendering: a whole line of the ledger file).
#
# How a listed risk matches a planted-pattern key (brief cases): G1 and G2 keys need
# an interval risk with the same code, hole section and formation. The G4 key needs
# a risk keyed on rig Vessra-3. The G3 key accepts either form: a risk keyed on the
# PJ-3 tool, or an interval risk with code DOWNHOLE_TOOL_FAILURE in the 12 1/4"
# section of that field, whatever its formation (the hot hole spans formations).
#
# Brief parameters: ORD-NEXT to 3,100 m on Orrindale, VSS-NEXT to 3,000 m on Vessra
# South, no rig, no MWD tool, default spread rate.

suite = "extended"

# ---------------------------------------------------------------------------
# Retrieval precision: the 8 original questions
# ---------------------------------------------------------------------------
# A relevant document says something about what was asked: the daily reports that
# carry the asked-about NPT entries (every part of an event that runs over reports),
# the incident reports of that code, and the EOWRs whose lessons describe it. Practice
# lessons and recommendations count only where the question asks what to do.
#
# EOWR NPT tables: every EOWR has an "NPT BREAKDOWN BY CODE" table with the well's
# hours per code. It answers a question about one code in a field (no hole section,
# formation, depth or kind of event narrower than the code), so for those questions
# the EOWR of every well that had the code is relevant, and it answers a question about
# one well's NPT. It is not counted for narrower questions, because the table is not
# broken down by section, formation, depth or kind of event.

# The pack-off reports, the stuck pipe incident reports (root cause section) and the
# EOWR lessons that describe the pack-off (they state the salt mud weight and depth).
[[case]]
id = "rp-orrindale-stuck"
category = "retrieval-precision"
question = "What caused stuck pipe on Orrindale wells in the 17 1/2\" section?"
field = "Orrindale"
relevant_sql = """
SELECT doc_id FROM truth_events WHERE field = 'Orrindale' AND code = 'STUCK_PIPE' AND section = '17 1/2"'
UNION SELECT doc_id FROM truth_docs WHERE type = 'incident' AND field = 'Orrindale' AND code = 'STUCK_PIPE'
UNION SELECT doc_id FROM truth_sentences WHERE field = 'Orrindale' AND code = 'STUCK_PIPE' AND label = 'failure'
"""

# The reports with instability entries in Keldra Salt and the EOWR lessons that record
# tight hole from salt creep (on wells with and without a later pack-off).
[[case]]
id = "rp-orrindale-salt"
category = "retrieval-precision"
question = "Show wellbore instability in Keldra Salt on Orrindale"
field = "Orrindale"
relevant_sql = """
SELECT doc_id FROM truth_events
 WHERE field = 'Orrindale' AND code = 'WELLBORE_INSTABILITY' AND formation = 'Keldra Salt'
UNION SELECT doc_id FROM truth_sentences
 WHERE field = 'Orrindale' AND kind = 'lesson' AND label = 'failure' AND text LIKE '%salt creep%'
"""

# Total losses only (partial losses below the carbonate top are a different event): the
# reports that carry a total-loss entry, the incident reports of those events, and the
# EOWR lessons that record the total losses.
[[case]]
id = "rp-vessra-losses"
category = "retrieval-precision"
question = "Total losses entering Vessra Carbonate on Vessra South"
field = "Vessra South"
relevant_sql = """
SELECT doc_id FROM truth_events WHERE field = 'Vessra South' AND variant = 'g2_total'
UNION SELECT d.doc_id FROM truth_docs d JOIN truth_events e ON e.event_id = d.event_id
 WHERE d.type = 'incident' AND d.field = 'Vessra South' AND e.variant = 'g2_total'
UNION SELECT doc_id FROM truth_sentences WHERE field = 'Vessra South' AND code = 'LOST_CIRCULATION' AND label = 'failure'
"""

# MWD failure reports in 12 1/4", their incident reports and the EOWR failure lessons.
[[case]]
id = "rp-mwd-failure"
category = "retrieval-precision"
question = "MWD tool failures in the 12 1/4\" section on Orrindale"
field = "Orrindale"
relevant_sql = """
SELECT doc_id FROM truth_events
 WHERE field = 'Orrindale' AND code = 'DOWNHOLE_TOOL_FAILURE' AND section = '12 1/4"'
UNION SELECT doc_id FROM truth_docs WHERE type = 'incident' AND field = 'Orrindale' AND code = 'DOWNHOLE_TOOL_FAILURE'
UNION SELECT doc_id FROM truth_sentences
 WHERE field = 'Orrindale' AND code = 'DOWNHOLE_TOOL_FAILURE' AND label = 'failure'
"""

# Mud pump repairs, not every rig repair: drawworks repairs are not mud pump problems.
[[case]]
id = "rp-rig-repair"
category = "retrieval-precision"
question = "Mud pump problems on Vessra South"
field = "Vessra South"
relevant_sql = """
SELECT doc_id FROM truth_events WHERE field = 'Vessra South' AND variant = 'g4_pump'
UNION SELECT doc_id FROM truth_sentences WHERE field = 'Vessra South' AND code = 'RIG_REPAIR' AND label = 'failure'
"""

# The question asks what the EOWRs recommend: the Orrindale EOWRs that carry a
# recommendation naming Keldra Salt.
[[case]]
id = "rp-lessons"
category = "retrieval-precision"
question = "What do the end of well reports recommend for Keldra Salt on Orrindale?"
field = "Orrindale"
relevant_sql = """
SELECT DISTINCT doc_id FROM truth_sentences
 WHERE field = 'Orrindale' AND kind = 'recommendation' AND text LIKE '%Keldra Salt%'
"""

# Cementing problem reports, the EOWR lessons on the leaking cement head, and the EOWRs
# whose NPT table lists cementing hours (one code in a field).
[[case]]
id = "rp-cement"
category = "retrieval-precision"
question = "Cementing problems on Orrindale"
field = "Orrindale"
relevant_sql = """
SELECT doc_id FROM truth_events WHERE field = 'Orrindale' AND code = 'CEMENT_ISSUE'
UNION SELECT doc_id FROM truth_sentences WHERE field = 'Orrindale' AND code = 'CEMENT_ISSUE'
UNION SELECT doc_id FROM truth_docs WHERE type = 'eowr' AND field = 'Orrindale'
 AND well IN (SELECT well FROM truth_events WHERE field = 'Orrindale' AND code = 'CEMENT_ISSUE')
"""

