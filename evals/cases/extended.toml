category = "abstention"
question = "How much NPT did ORD-199 have?"
precondition_sql = "SELECT COUNT(*) = 0 FROM truth_docs WHERE well = 'ORD-199'"

# FISHING exists in the workspace (Orrindale), but not in Vessra South.
[[case]]
