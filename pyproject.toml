[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wellbrief"
version = "0.1.0"
description = "Offline-first RAG for drilling engineers: cited answers from well files and a pre-spud offset-well risk brief."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andrii Boiko" }]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "air-gapped",
    "offline-first",
    "oil-and-gas",
    "drilling",
    "petroleum-engineering",
    "hybrid-search",
    "bm25",
    "citations",
    "llm-evaluation",
    "local-llm",
    "sqlite",
    "document-intelligence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    # The floor excludes every pypdf release with a published advisory on the text-extraction
    # path `readers.pdf.read_pdf` uses, as of 2026-09-26 (see docs/adr/0001-dependency-surface.md).
    "pypdf>=6.19.0",
]

[project.urls]
Homepage = "https://github.com/B0yko/wellbrief"
Repository = "https://github.com/B0yko/wellbrief"
Issues = "https://github.com/B0yko/wellbrief/issues"

[project.scripts]
wellbrief = "wellbrief.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wellbrief"]

[tool.hatch.build.targets.wheel.force-include]
# The eval case files live at the repository's own `evals/cases/`, outside the package
# directory, so an editable or source-checkout run finds them there (see
# `evals.cases.default_dir`). A built wheel has no repository around it, so this copies
# the same files into the package at build time; `default_dir` also looks next to itself.
"evals/cases" = "wellbrief/evals/cases"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["wellbrief"]

[tool.coverage.report]
show_missing = true
# Measured line coverage is currently well above this; the gate guards against a
# regression below the project's stated target, not a target in itself.
fail_under = 85

[tool.ruff]
line-length = 110
target-version = "py312"
# tests/ is a source root so its helper modules sort as first-party imports.
src = ["src", "tests"]

[tool.ruff.lint]
# No rule is ignored globally; the few justified exceptions are inline noqa comments with a reason.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "C4",   # flake8-comprehensions
    "BLE",  # flake8-blind-except: every broad except states why
]

[tool.ruff.lint.isort]
known-first-party = ["wellbrief"]
combine-as-imports = true

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"
